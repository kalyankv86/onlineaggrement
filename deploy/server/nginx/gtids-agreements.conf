##
# GTIDS Agreement Portal — single ingress.
#
# Everything is served from one hostname: the portal at /, the API under /api/v1.
# That keeps the browser same-origin, so the session cookie is never sent
# cross-site and CORS stays closed.
#
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled.
##

# The rate-limit zones and upstreams this site uses are declared once, at http
# level, in /etc/nginx/conf.d/gtids-http.conf. They cannot live here: both are
# http-level directives that may appear only once, so a second copy of this file
# would invalidate the entire nginx configuration rather than just itself.

server {
    listen 80;
    listen [::]:80;
    server_name agreements.gtids.example;

    # ACME challenges must stay on port 80; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # Only redirect when the client really did use HTTP. Where a fronting
        # proxy terminated TLS and forwarded here over port 80, the client is
        # already on HTTPS and redirecting it again loops forever.
        if ($gtids_client_scheme = http) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://gtids_web;
        include /etc/nginx/gtids-proxy-params.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agreements.gtids.example;

    ssl_certificate     /etc/letsencrypt/live/agreements.gtids.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agreements.gtids.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # An agreement portal has no business being embedded, and no business
    # reaching any origin but its own.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 15m;   # stamp scans are capped at 10 MB by the API

    access_log /var/log/nginx/gtids-access.log;
    error_log  /var/log/nginx/gtids-error.log;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=gtids_auth burst=5 nodelay;
        proxy_pass http://gtids_api;
        include /etc/nginx/gtids-proxy-params.conf;
    }

    location /api/v1/verify/ {
        limit_req zone=gtids_verify burst=10 nodelay;
        proxy_pass http://gtids_api;
        include /etc/nginx/gtids-proxy-params.conf;
    }

    location /api/v1/esign/callback {
        # The eSign provider's callback. Restrict to the provider's published
        # egress addresses once DEC-002 is closed; the payload signature is
        # verified by the application regardless.
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://gtids_api;
        include /etc/nginx/gtids-proxy-params.conf;
    }

    location /api/v1/ {
        limit_req zone=gtids_api burst=40 nodelay;
        proxy_pass http://gtids_api;
        include /etc/nginx/gtids-proxy-params.conf;
    }

    # ── Portal ───────────────────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://gtids_web;
        include /etc/nginx/gtids-proxy-params.conf;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://gtids_web;
        include /etc/nginx/gtids-proxy-params.conf;
    }

    # Health endpoints are for the operator and any local monitor, not the world.
    location = /api/v1/health/ready {
        allow 127.0.0.1;
        allow ::1;
        # allow 10.0.0.0/8;   # monitoring subnet
        deny all;
        proxy_pass http://gtids_api;
        include /etc/nginx/gtids-proxy-params.conf;
    }
}
