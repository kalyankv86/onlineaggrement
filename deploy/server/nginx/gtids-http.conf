##
# Shared http-level configuration — install to /etc/nginx/conf.d/gtids-http.conf
#
# Everything here is an http-level directive that may be declared exactly once:
# rate-limit zones and upstreams. They were originally inside the site file,
# which meant a second copy of that file — a stale hostname left in
# sites-enabled, or a second environment on the same box — invalidated the whole
# nginx configuration rather than just the duplicate.
#
# The site file is now purely a server block. It only *uses* what is defined here.
##

# Sign-in: worth protecting from brute force.
limit_req_zone $binary_remote_addr zone=gtids_auth:10m   rate=10r/m;

# General API traffic.
limit_req_zone $binary_remote_addr zone=gtids_api:10m    rate=120r/m;

# Public verification. Limited here as well as in the application, which also
# keeps the response constant-time so it cannot be used to enumerate agreements
# (DEC-006).
limit_req_zone $binary_remote_addr zone=gtids_verify:10m rate=20r/m;

# ── Upstreams ────────────────────────────────────────────────────────────────
# Both bind to loopback; nginx is the only ingress.
upstream gtids_api { server 127.0.0.1:3100 fail_timeout=10s; keepalive 16; }
upstream gtids_web { server 127.0.0.1:3101 fail_timeout=10s; keepalive 16; }
