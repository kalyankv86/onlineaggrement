##
# Shared proxy parameters. Install to /etc/nginx/gtids-proxy-params.conf.
##

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# The application records the first hop for the audit trail (SRS §10), so this
# must be set by nginx and not accepted from the client.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
# Set once, here. An included directive cannot be overridden in a location — nginx
# rejects the duplicate — so this is sized for the slowest legitimate request:
# PDF generation and eSign provider round trips.
proxy_read_timeout    120s;

# Signed PDFs are streamed straight through; buffering them to disk would put
# agreement bytes in nginx's temp directory, outside the document store.
proxy_buffering off;
proxy_request_buffering off;
